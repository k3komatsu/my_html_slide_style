<section class="slide slide--cover"><h1 class="cover-title" style="top:180px">{{title}}</h1></section>
<section class="slide" id="model">
  <h1 class="slide__title">Model</h1>
  <div class="content cols-2">
    <div class="stack"><p>\(E = mc^2\)</p><p>A flow layout</p><a href="#result">Result</a></div>
    <figure><img src="figure.svg" width="200" height="120" alt="A blue rectangle"></figure>
  </div>
</section>
<section class="slide" id="result">
  <h1 class="slide__title">Result</h1>
  <div class="box sim-controls interactive" style="--y:100px">
    <label><span>Scale</span><input id="scale" type="range" min="1" max="5" value="3"><output id="value">3</output></label>
  </div>
</section>
